#
# Samba configuration for the embroidery file bridge.
#
# Unlike the original pi-file-bridge project, this share points at a
# persistent staging directory on the Pi's own SD card, NOT at the
# embroidery machine's USB mass-storage device. Files dropped here
# survive reboots and survive the machine being off. A separate
# service (see embroidery-sync.sh / embroidery-sync.service) pushes
# them onto the machine whenever it's actually connected and powered
# on. See README.md for the full design rationale.
#

[global]
   workgroup = WORKGROUP
   dns proxy = no
   log file = /var/log/samba/log.%m
   max log size = 1000
   syslog = 0
   panic action = /usr/share/samba/panic-action %d
   server role = standalone server
   passdb backend = tdbsam
   obey pam restrictions = yes
   unix password sync = yes
   passwd program = /usr/bin/passwd %u
   passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .
   pam password change = yes
   map to guest = bad user
   usershare allow guests = yes

[machine]
   comment = Embroidery Machine File Bridge (persistent staging)
   path = /srv/embroidery/incoming
   guest ok = yes
   guest only = yes
   read only = no
   force user = pi
   force group = pi
   create mask = 0644
   directory mask = 0755
